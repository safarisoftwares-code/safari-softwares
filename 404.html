<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <style>
    :root{--orange:#d97706;--amber:#b65c04;--brown:#78350f;--cream:#faf9f6;--charcoal:#1a1a1a;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--charcoal);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.25rem;}
    .lion{width:120px;height:120px;margin-bottom:1.5rem;filter:drop-shadow(0 8px 20px rgba(217,119,6,.25));}
    .code{font-size:clamp(4rem,12vw,7rem);font-weight:900;line-height:1;color:var(--orange);letter-spacing:-.04em;}
    h1{font-size:clamp(1.4rem,3.5vw,2rem);margin:.75rem 0 .5rem;color:var(--brown);}
    p{max-width:480px;line-height:1.6;color:#444;margin-bottom:2rem;}
    .btns{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;}
    a.btn{display:inline-block;padding:.85rem 1.5rem;border-radius:10px;font-weight:600;text-decoration:none;transition:transform .15s,box-shadow .15s;}
    a.primary{background:var(--orange);color:#fff;}
    a.primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(217,119,6,.35);}
    a.secondary{background:#fff;color:var(--brown);border:1px solid #e5e0d5;}
    a.secondary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08);}
    footer{margin-top:3rem;font-size:.85rem;color:#8a8175;}
    footer a{color:var(--amber);text-decoration:none;font-weight:600;}
  </style>
</head>
<body>
  <img src="/assets/lion-header.png" alt="Safari Softwares lion" class="lion" onerror="this.style.display='none'">
